<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <!-- Symbol Icon (Left) -->
  <g transform="translate(4, 4)">
    <!-- Scope Outer Frame / Precision Reticle -->
    <rect x="2" y="2" width="44" height="44" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Reticle Crosshair Ticks -->
    <line x1="24" y1="5" x2="24" y2="9" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="39" x2="24" y2="43" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="24" x2="9" y2="24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="39" y1="24" x2="43" y2="24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Inner Evidence Document Outline -->
    <rect x="13" y="12" width="22" height="24" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Evidence Document Lines -->
    <line x1="17" y1="18" x2="25" y2="18" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17" y1="23" x2="29" y2="23" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Sharp Precision Verification Checkmark -->
    <path d="M19 28.5L23 32.5L31 22" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark & Descriptor (Right) -->
  <text x="62" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.03em">VeriScope</text>
  <text x="62" y="44" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="0.14em">PROOF DESK SCANNER</text>
</svg>
